name: Mirror to CNB

on:
  push:
    branches: ['master']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Sync master and tags
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git history and LFS files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to CNB
        env:
          CNB_MIRROR_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
        run: |
          if [ -z "$CNB_MIRROR_TOKEN" ]; then
            echo '::error::Set the CNB_MIRROR_TOKEN repository secret before enabling the mirror.'
            exit 1
          fi

          cat > "$RUNNER_TEMP/cnb-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'cnb\n' ;;
            *Password*) printf '%s\n' "$CNB_MIRROR_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/cnb-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/cnb-askpass"
          export GIT_TERMINAL_PROMPT=0

          git remote add cnb https://cnb.cool/ycoj-ui/ycoj-v3
          git fetch origin master --tags
          git lfs fetch origin master
          git lfs push cnb refs/remotes/origin/master
          git push cnb refs/remotes/origin/master:refs/heads/master --tags
