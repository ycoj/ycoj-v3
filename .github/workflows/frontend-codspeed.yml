name: Frontend CodSpeed

on:
  push:
    branches: ['master']
    paths:
      - 'ycoj-ui/**'
      - '.github/**'
      - 'AGENTS.md'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths:
      - 'ycoj-ui/**'
      - '.github/**'
      - 'AGENTS.md'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Frontend benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ycoj-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          package_json_file: ycoj-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ycoj-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm --dir ycoj-ui bench
