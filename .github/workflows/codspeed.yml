name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

# CodSpeed aggregates benchmark jobs only within the same workflow run.
jobs:
  backend-benchmarks:
    name: Backend benchmarks
    runs-on: ubuntu-latest
    env:
      CI: true
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: |
          yarn set version 4.13.0
          yarn install

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: yarn bench

  frontend-benchmarks:
    name: Frontend benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ycoj-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          package_json_file: ycoj-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ycoj-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm --dir ycoj-ui bench
