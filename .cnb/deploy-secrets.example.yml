# Copy this file into the CNB secret repository, never put real secrets here.
allow_slugs:
  - ycoj-ui/ycoj-v3
allow_branches:
  - master
allow_events:
  - push

BACKEND_BASEURL: 'http://127.0.0.1:2333'
NEXT_PUBLIC_UPLOAD_BASEURL: ''
NEXT_PUBLIC_WEBSOCKET_BASEURL: ''
# Fallback only: runtime branding matched by visiting origin takes precedence.
SITE_NAME: 'YCOJ'

DEPLOY_HOST: 'your-server.example.com'
DEPLOY_PORT: '22'
DEPLOY_USER: 'your-pm2-user'
DEPLOY_ROOT: '/srv/ycoj-ui'
DEPLOY_BACKEND_ROOT: '/srv/ycoj-v3'
DEPLOY_BACKEND_PM2_NAME: 'ycoj'
# Optional: defaults to BACKEND_BASEURL + /branding?origin=http%3A%2F%2Flocalhost.
# Must be reachable from the production server, without authentication.
# DEPLOY_BACKEND_HEALTH_URL: 'http://127.0.0.1:2333/branding?origin=http%3A%2F%2Flocalhost'
# Upload the first release, then migrate PM2 using docs/cnb-deployment.md.
# Change to 'true' once the initial migration succeeds.
DEPLOY_ACTIVATE: 'false'
DEPLOY_SSH_KEY: |
  REPLACE_WITH_THE_DEPLOY_PRIVATE_KEY
DEPLOY_KNOWN_HOSTS: |
  REPLACE_WITH_VERIFIED_SSH_KNOWN_HOSTS_LINES
