master:
  push:
    - name: deploy-ui
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: node:22-bookworm
        volumes:
          - /root/.local/share/pnpm/store
      git:
        lfs: true
        submodules: false
      env:
        npm_config_registry: https://mirrors.cloud.tencent.com/npm/
      imports:
        - https://cnb.cool/ycoj-ui/ycoj-secrets/-/blob/main/ycoj-ui.yml
      stages:
        - name: Prepare build tools
          script: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends openssh-client ca-certificates
            npm install --global pnpm@10.11.1
            test "$(uname -m)" = x86_64
        - name: Build standalone UI
          timeout: 60m
          script: |
            set -eu
            : "${BACKEND_BASEURL:?Set BACKEND_BASEURL in the CNB secret file}"
            cd ycoj-ui
            pnpm install --frozen-lockfile
            YCOJ_STANDALONE=1 pnpm build
        - name: Package UI
          script: bash .cnb/package-ui.sh
        - name: Upload and deploy UI
          timeout: 30m
          lock:
            key: production-ui
            wait: true
            expires: 1800
            timeout: 3600
          script: bash .cnb/deploy-ui.sh
