allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cpu-features: true
  msw: true
  sharp: true
  ssh2: true
  unrs-resolver: true

overrides:
  md-editor-rt>markdown-it: 14.3.1
  # Keep generated math markup aligned with the directly imported KaTeX CSS.
  rehype-katex>katex: $katex

# Reviewed security release: https://github.com/nodejs/undici/releases/tag/v7.30.1
minimumReleaseAgeExclude:
  - undici@7.30.1
