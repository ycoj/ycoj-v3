allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cpu-features: true
  msw: true
  sharp: true
  ssh2: true
  unrs-resolver: true

overrides:
  md-editor-rt>markdown-it: 14.3.1

minimumReleaseAgeExclude:
  # Reviewed security release: https://github.com/nodejs/undici/releases/tag/v7.30.1
  - undici@7.30.1
  # Explicitly selected and pinned renderer: https://github.com/TaiRuiQu/VelociTex
  - velocitex@1.0.0
